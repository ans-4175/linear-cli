name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate version
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo 'Expected a tag like v1.2.3 or v1.2.3-rc.1'
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check out existing tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          persist-credentials: false
      - name: Pin release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Verify tagged source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            extension: ""
          - goos: darwin
            goarch: arm64
            extension: ""
          - goos: linux
            goarch: amd64
            extension: ""
          - goos: linux
            goarch: arm64
            extension: ""
          - goos: windows
            goarch: amd64
            extension: ".exe"
          - goos: windows
            goarch: arm64
            extension: ".exe"
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          EXTENSION: ${{ matrix.extension }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="linear-cli_${VERSION}_${GOOS}_${GOARCH}"
          stage="dist/stage"
          mkdir -p "$stage"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$stage/linear-cli${EXTENSION}" .
          cp README.md "$stage/README.md"
          cp skills/linear-cli.md "$stage/AGENT_GUIDE.md"
          if [ "$GOOS" = windows ]; then
            (cd "$stage" && zip -q "../${name}.zip" linear-cli.exe README.md AGENT_GUIDE.md)
          else
            tar -czf "dist/${name}.tar.gz" -C "$stage" linear-cli README.md AGENT_GUIDE.md
          fi
      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download all six archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify asset set and checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              ext=tar.gz
              if [ "$os" = windows ]; then ext=zip; fi
              test -s "dist/linear-cli_${VERSION}_${os}_${arch}.${ext}"
            done
          done
          count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          test "$count" -eq 6
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Upload to a draft first: an incomplete upload must not appear as a finished release.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-is-draft; then
            if [ "$(tr -d '\r\n' < /tmp/release-is-draft)" != true ]; then
              echo 'This release is already published; refusing to overwrite it.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "linear-cli $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets
